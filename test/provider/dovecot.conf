# Fournisseur simulé — TEST UNIQUEMENT.
# BAL des destinataires : livraison LMTP (127.0.0.1:24, depuis Postfix),
# consultation en IMAPS 993 seulement (certificat de la PKI de test).
dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.2

protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout

mail_driver = maildir
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir

ssl = required
ssl_server_cert_file = /pki/provider.crt
ssl_server_key_file = /pki/provider.key
ssl_min_protocol = TLSv1.2

auth_mechanisms = plain
auth_allow_cleartext = no

# Comptes générés par l'entrypoint (adresse complète comme identifiant).
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

namespace inbox {
  inbox = yes
  separator = /
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    listen = 127.0.0.1
    port = 24
  }
}
