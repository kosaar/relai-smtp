# =============================================================================
#  CI GitLab du relai SMTP.
#   lint        : shellcheck, compilation Python, tests unitaires (tests/ci/lint.sh)
#   integration : construction des images + tests d'intégration et de bout en
#                 bout (tests/run-tests.sh : vrais Postfix, Dovecot, GnuPG, RNP)
#   release     : image du relai poussée dans le registre du projet (tags git)
#
#  Prérequis du runner pour « integration » et « release » : exécuteur Docker
#  avec service docker:dind en mode privilégié. La stack de test monte des
#  fichiers du dépôt (secrets générés dans tests/.work) : le répertoire de build
#  doit être visible du démon Docker au même chemin (comportement par défaut
#  du service dind partageant /builds ; sinon, exécuteur « shell » avec Docker).
# =============================================================================

stages: [lint, integration, release]

variables:
  UBUNTU_TAG: resolute-20260927
  DOCKER_TLS_CERTDIR: "/certs"

default:
  interruptible: true

lint:
  stage: lint
  image: ubuntu:${UBUNTU_TAG}
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends shellcheck python3 git >/dev/null
  script:
    - tests/ci/lint.sh

.docker:
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  before_script:
    - apk add --no-cache bash coreutils git >/dev/null
    - docker info >/dev/null

integration:
  extends: .docker
  stage: integration
  timeout: 45m
  script:
    - tests/run-tests.sh
  artifacts:
    when: on_failure
    paths: [tests/.logs/]
    expire_in: 7 days

release:
  extends: .docker
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg VERSION="$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/smtp-relay:$CI_COMMIT_TAG" relay
    - docker push "$CI_REGISTRY_IMAGE/smtp-relay:$CI_COMMIT_TAG"
