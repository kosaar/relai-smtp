# =============================================================================
#  Stack de PRODUCTION du relai SMTP applicatif.
#  Configuration :
#   - config/applications.toml   inventaire versionné des applications ;
#   - secrets/apps/<application> mot de passe SMTP de chaque application ;
#   - secrets/relay_smtp_*       identifiants chez le fournisseur ;
#   - secrets/relay_tls_*        certificat et clé de smtp-relay (soumission 587) ;
#   - secrets/keydir_tls_*       certificat et clé de l'annuaire (openpgpkey.<domaine>) ;
#   - secrets/gateway_hmac_key   clé de pseudonymisation des identifiants de message ;
#   - .env                       paramètres (copie de .env.example).
#  Usage : docker compose up -d --build
# =============================================================================
name: smtp-relay

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  relay:
    <<: *hardening
    build:
      context: .
      dockerfile: relay/Dockerfile
      args:
        VERSION: ${RELAY_IMAGE_TAG:-2.0.0}
    image: smtp-relay:${RELAY_IMAGE_TAG:-2.0.0}
    hostname: relay
    restart: unless-stopped
    environment:
      # --- Applications (inventaire + un secret par application)
      RELAY_INVENTORY_FILE: /etc/relay/applications.toml
      RELAY_APP_SECRETS_DIR: /run/secrets/apps
      RELAY_AUTH_RATE_LIMIT: ${RELAY_AUTH_RATE_LIMIT:-30}
      MESSAGE_SIZE_LIMIT: ${MESSAGE_SIZE_LIMIT:-10240000}
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:-}
      # --- Passerelle (réseau backend) : milter (identité, clés) et filtre avant
      #     file (chiffrement) ; les messages chiffrés reviennent sur le port de
      #     réinjection, ouvert à la seule IP de la passerelle.
      RELAY_MILTER: inet:gateway:9900
      RELAY_PROXY_FILTER: gateway:10025
      RELAY_REINJECT_PORT: "10026"
      # --- Fournisseur cloud
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-587}
      RELAY_TLS_WRAPPERMODE: ${RELAY_TLS_WRAPPERMODE:-auto}
      RELAY_TLS_SECURITY_LEVEL: ${RELAY_TLS_SECURITY_LEVEL:-secure}
      RELAY_SASL_MECHANISMS: ${RELAY_SASL_MECHANISMS:-plain, login}
      QUEUE_LIFETIME: ${QUEUE_LIFETIME:-5d}
      # --- Supervision : exporteur Prometheus (port 9154) ; les métriques de
      #     l'annuaire (clés) sont lues sur son port interne et recopiées.
      RELAY_METRICS_PROBE_INTERVAL: ${RELAY_METRICS_PROBE_INTERVAL:-300}
      RELAY_KEYDIR_METRICS_URL: http://keydir:9155/metrics
      # --- Test après déploiement : docker compose exec relay relay-smoke-test
      #     (application locale « supervision » de l'inventaire -> cette BAL).
      RELAY_SMOKE_TO: ${RELAY_SMOKE_TO:-}
      TZ: ${TZ:-UTC}
    secrets:
      - relay_smtp_username
      - relay_smtp_password
      - relay_tls_cert
      - relay_tls_key
    ports:
      # Publier UNIQUEMENT sur l'IP privée de l'hôte (VLAN Services), jamais sur
      # une interface publique. Le seul port SMTP est la soumission 587.
      - "${RELAY_BIND_ADDRESS:?RELAY_BIND_ADDRESS doit contenir l'IP privée de l'hôte}:${RELAY_PUBLISHED_PORT:-587}:587"
      # Métriques Prometheus : par défaut sur la boucle locale de l'hôte ; mettre
      # l'IP du VLAN de supervision dans RELAY_METRICS_BIND_ADDRESS.
      - "${RELAY_METRICS_BIND_ADDRESS:-127.0.0.1}:${RELAY_METRICS_PUBLISHED_PORT:-9154}:9154"
    volumes:
      - relay-queue:/var/spool/postfix
      - ./config:/etc/relay:ro
      - ./secrets/apps:/run/secrets/apps:ro
    networks:
      relay-net:
        aliases: [smtp-relay]
      backend: {}
    depends_on:
      gateway:
        condition: service_healthy
    # --- Moindre privilège
    # Le processus maître Postfix démarre en root (lecture des secrets, base
    # SASL) puis délègue à l'utilisateur "postfix" non privilégié.
    tmpfs:
      - /etc/postfix:mode=0755,size=4m
      - /var/lib/postfix:mode=0700,size=8m
      - /run:mode=0755,size=4m
      - /tmp:mode=1777,size=16m
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Passerelle : appelée par Postfix (milter) avant la mise en file ; refuse
  # les destinataires sans clé valide et chiffre chaque message (PGP/MIME).
  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        VERSION: ${RELAY_IMAGE_TAG:-2.0.0}
    image: smtp-relay-gateway:${RELAY_IMAGE_TAG:-2.0.0}
    hostname: gateway
    restart: unless-stopped
    environment:
      GATEWAY_INVENTORY_FILE: /etc/relay/applications.toml
      # Règles de contrôle du contenu (versionnées dans config/).
      GATEWAY_CONTENT_RULES_FILE: /etc/relay/content-rules.toml
      # Annuaire de clés (WKD) : HTTPS vérifié par l'AC indiquée.
      GATEWAY_KEYDIR_URL: https://keydir:8443
      GATEWAY_KEYDIR_CA_FILE: ${GATEWAY_KEYDIR_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      GATEWAY_KEY_CACHE_TTL: ${GATEWAY_KEY_CACHE_TTL:-300}
      GATEWAY_NEUTRAL_SUBJECT: ${GATEWAY_NEUTRAL_SUBJECT:-Message chiffré}
      GATEWAY_PROXY_LISTEN: 0.0.0.0:10025
      GATEWAY_REINJECT_PORT: "10026"
      TZ: ${TZ:-UTC}
    secrets:
      - gateway_hmac_key
    volumes:
      - ./config:/etc/relay:ro
    networks:
      backend:
        # Adresse fixe : le port de réinjection du relai n'accepte qu'elle.
        ipv4_address: ${GATEWAY_BACKEND_IP:-172.30.53.20}
    # Démarre en root (copie du secret) puis s'exécute sous l'utilisateur
    # gateway, sans capacité.
    tmpfs:
      - /run:mode=0755,size=4m
      - /tmp:mode=1777,size=16m
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Annuaire de clés publiques : dépôt HTTPS (postes), validation par un
  # administrateur, publication WKD (passerelle, Thunderbird).
  keydir:
    <<: *hardening
    build:
      context: .
      dockerfile: keydir/Dockerfile
      args:
        VERSION: ${RELAY_IMAGE_TAG:-2.0.0}
    image: smtp-relay-keydir:${RELAY_IMAGE_TAG:-2.0.0}
    hostname: keydir
    restart: unless-stopped
    environment:
      KEYDIR_DOMAINS: ${KEYDIR_DOMAINS:?KEYDIR_DOMAINS doit lister les domaines publiés par l'annuaire}
      KEYDIR_AUDIT_RETENTION_DAYS: ${KEYDIR_AUDIT_RETENTION_DAYS:-365}
      # Clés signalées « proches de l'expiration » (métriques, port interne 9155
      # non publié, lu par l'exporteur du relai).
      KEYDIR_EXPIRY_WARNING_DAYS: ${KEYDIR_EXPIRY_WARNING_DAYS:-30}
      KEYDIR_METRICS_LISTEN: 0.0.0.0:9155
      TZ: ${TZ:-UTC}
    secrets:
      - keydir_tls_cert
      - keydir_tls_key
    ports:
      # Publié sur l'IP privée de l'hôte, pour les postes (dépôt de clé, WKD).
      - "${KEYDIR_BIND_ADDRESS:?KEYDIR_BIND_ADDRESS doit contenir l'IP privée de l'hôte}:${KEYDIR_PUBLISHED_PORT:-443}:8443"
    volumes:
      - keydir-data:/var/lib/keydir
    networks:
      keydir-net:
        aliases: [keydir]
      backend: {}
    # Démarre en root (copie du certificat, droits du volume) puis s'exécute
    # sous l'utilisateur keydir, sans capacité.
    tmpfs:
      - /run:mode=0755,size=4m
      - /tmp:mode=1777,size=32m
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD", "/usr/local/bin/keydir-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  relay-net:
    driver: bridge
  # Postes de travail -> annuaire (HTTPS).
  keydir-net:
    driver: bridge
  # Relai <-> passerelle <-> annuaire : aucun accès extérieur.
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.53.0/24}

volumes:
  relay-queue:
  keydir-data:

secrets:
  relay_smtp_username:
    file: ./secrets/relay_smtp_username
  relay_smtp_password:
    file: ./secrets/relay_smtp_password
  relay_tls_cert:
    file: ./secrets/relay_tls_cert
  relay_tls_key:
    file: ./secrets/relay_tls_key
  keydir_tls_cert:
    file: ./secrets/keydir_tls_cert
  keydir_tls_key:
    file: ./secrets/keydir_tls_key
  gateway_hmac_key:
    file: ./secrets/gateway_hmac_key
