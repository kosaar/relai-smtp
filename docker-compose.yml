# =============================================================================
#  Stack de PRODUCTION du relai SMTP interne.
#  Configuration : fichier .env (copie de .env.example) + Docker secrets
#  (./secrets/relay_smtp_username, ./secrets/relay_smtp_password).
#  Usage : docker compose up -d --build
# =============================================================================
name: smtp-relay

services:
  relay:
    build:
      context: ./relay
      args:
        VERSION: ${RELAY_IMAGE_TAG:-1.0.0}
    image: smtp-relay:${RELAY_IMAGE_TAG:-1.0.0}
    hostname: relay
    restart: unless-stopped
    environment:
      # --- Côté applications (réseau privé)
      ALLOWED_CLIENT_IPS: ${ALLOWED_CLIENT_IPS:-}
      ALLOWED_CLIENT_IPS_FILE: ${ALLOWED_CLIENT_IPS_FILE:-}
      RELAY_LISTEN_PORT: "25"
      MESSAGE_SIZE_LIMIT: ${MESSAGE_SIZE_LIMIT:-10240000}
      # --- Expéditeur
      SENDER_DOMAIN: ${SENDER_DOMAIN:-}
      SENDER_ADDRESS: ${SENDER_ADDRESS:-}
      SENDER_REWRITE_MODE: ${SENDER_REWRITE_MODE:-always}
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:-}
      # --- Fournisseur cloud
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-587}
      RELAY_TLS_WRAPPERMODE: ${RELAY_TLS_WRAPPERMODE:-auto}
      RELAY_TLS_SECURITY_LEVEL: ${RELAY_TLS_SECURITY_LEVEL:-secure}
      RELAY_SASL_MECHANISMS: ${RELAY_SASL_MECHANISMS:-plain, login}
      QUEUE_LIFETIME: ${QUEUE_LIFETIME:-5d}
      TZ: ${TZ:-UTC}
    secrets:
      - relay_smtp_username
      - relay_smtp_password
    ports:
      # Publier UNIQUEMENT sur l'IP privée de l'hôte (jamais sur une interface publique).
      - "${RELAY_BIND_ADDRESS:?RELAY_BIND_ADDRESS doit contenir l'IP privée de l'hôte}:${RELAY_PUBLISHED_PORT:-25}:25"
    volumes:
      - relay-queue:/var/spool/postfix
      # Liste blanche sous forme de fichier (optionnel, rechargeable à chaud) :
      # - ./config/allowed_clients.txt:/etc/relay/allowed_clients.txt:ro
    networks:
      - relay-net
    # --- Moindre privilège
    # Le processus maître Postfix doit démarrer en root (bind du port 25,
    # lecture des secrets) puis délègue à l'utilisateur "postfix" non privilégié.
    read_only: true
    tmpfs:
      - /etc/postfix:mode=0755,size=4m
      - /var/lib/postfix:mode=0700,size=8m
      - /run:mode=0755,size=4m
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  relay-net:
    driver: bridge

volumes:
  relay-queue:

secrets:
  relay_smtp_username:
    file: ./secrets/relay_smtp_username
  relay_smtp_password:
    file: ./secrets/relay_smtp_password
