# =============================================================================
#  Stack de PRODUCTION du relai SMTP applicatif.
#  Configuration :
#   - config/applications.toml   inventaire versionné des applications ;
#   - secrets/apps/<application> mot de passe SMTP de chaque application ;
#   - secrets/relay_smtp_*       identifiants chez le fournisseur ;
#   - secrets/relay_tls_*        certificat et clé de smtp-relay (soumission 587) ;
#   - .env                       paramètres (copie de .env.example).
#  Usage : docker compose up -d --build
# =============================================================================
name: smtp-relay

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  relay:
    <<: *hardening
    build:
      context: .
      dockerfile: relay/Dockerfile
      args:
        VERSION: ${RELAY_IMAGE_TAG:-2.0.0}
    image: smtp-relay:${RELAY_IMAGE_TAG:-2.0.0}
    hostname: relay
    restart: unless-stopped
    environment:
      # --- Applications (inventaire + un secret par application)
      RELAY_INVENTORY_FILE: /etc/relay/applications.toml
      RELAY_APP_SECRETS_DIR: /run/secrets/apps
      RELAY_AUTH_RATE_LIMIT: ${RELAY_AUTH_RATE_LIMIT:-30}
      MESSAGE_SIZE_LIMIT: ${MESSAGE_SIZE_LIMIT:-10240000}
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:-}
      # --- Passerelle (milter, réseau backend)
      RELAY_MILTER: inet:gateway:9900
      # --- Fournisseur cloud
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-587}
      RELAY_TLS_WRAPPERMODE: ${RELAY_TLS_WRAPPERMODE:-auto}
      RELAY_TLS_SECURITY_LEVEL: ${RELAY_TLS_SECURITY_LEVEL:-secure}
      RELAY_SASL_MECHANISMS: ${RELAY_SASL_MECHANISMS:-plain, login}
      QUEUE_LIFETIME: ${QUEUE_LIFETIME:-5d}
      TZ: ${TZ:-UTC}
    secrets:
      - relay_smtp_username
      - relay_smtp_password
      - relay_tls_cert
      - relay_tls_key
    ports:
      # Publier UNIQUEMENT sur l'IP privée de l'hôte (VLAN Services), jamais sur
      # une interface publique. Seul le port de soumission 587 existe.
      - "${RELAY_BIND_ADDRESS:?RELAY_BIND_ADDRESS doit contenir l'IP privée de l'hôte}:${RELAY_PUBLISHED_PORT:-587}:587"
    volumes:
      - relay-queue:/var/spool/postfix
      - ./config:/etc/relay:ro
      - ./secrets/apps:/run/secrets/apps:ro
    networks:
      relay-net:
        aliases: [smtp-relay]
      backend: {}
    depends_on:
      gateway:
        condition: service_healthy
    # --- Moindre privilège
    # Le processus maître Postfix démarre en root (lecture des secrets, base
    # SASL) puis délègue à l'utilisateur "postfix" non privilégié.
    tmpfs:
      - /etc/postfix:mode=0755,size=4m
      - /var/lib/postfix:mode=0700,size=8m
      - /run:mode=0755,size=4m
      - /tmp:mode=1777,size=16m
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Passerelle : appelée par Postfix (milter) avant la mise en file.
  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        VERSION: ${RELAY_IMAGE_TAG:-2.0.0}
    image: smtp-relay-gateway:${RELAY_IMAGE_TAG:-2.0.0}
    hostname: gateway
    restart: unless-stopped
    environment:
      GATEWAY_INVENTORY_FILE: /etc/relay/applications.toml
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/etc/relay:ro
    networks:
      - backend
    tmpfs:
      - /tmp:mode=1777,size=16m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  relay-net:
    driver: bridge
  # Relai <-> passerelle : aucun accès extérieur.
  backend:
    driver: bridge
    internal: true

volumes:
  relay-queue:

secrets:
  relay_smtp_username:
    file: ./secrets/relay_smtp_username
  relay_smtp_password:
    file: ./secrets/relay_smtp_password
  relay_tls_cert:
    file: ./secrets/relay_tls_cert
  relay_tls_key:
    file: ./secrets/relay_tls_key
