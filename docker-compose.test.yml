# =============================================================================
#  Stack de TEST — surcharge de docker-compose.yml (le relai testé est donc
#  exactement celui de production, seuls les paramètres changent).
#  Lancée par tests/run-tests.sh :
#    docker compose -p smtp-relay-test --env-file tests/test.env \
#      -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
#  Réseaux (IP fixes, sans accès extérieur) :
#    private  10.0.1.0/24 : client-gitlab .10, client-jenkins .20,
#                           client-unknown .30 (NON déclaré), relay .5,
#                           relay-badcreds .6
#    internet 10.0.2.0/24 : relay .5, relay-badcreds .6, provider .10,
#                           workstation .50
# =============================================================================

x-relay-test-env: &relay-test-env
  ALLOWED_CLIENT_IPS: "10.0.1.10,10.0.1.20"
  SENDER_DOMAIN: example.com
  SENDER_ADDRESS: noreply@example.com
  SENDER_REWRITE_MODE: always
  RELAY_HOST: provider
  RELAY_PORT: "587"
  RELAY_TLS_SECURITY_LEVEL: secure
  RELAY_TLS_CA_FILE: /etc/test-pki/ca.crt

x-depends-provider: &depends-provider
  provider:
    condition: service_healthy

services:
  # One-shot : PKI de test (AC + certificats provider, smtp-relay, keydir).
  pki:
    build: ./test/provider
    image: smtp-relay-test/provider:latest
    entrypoint: ["/usr/local/bin/gen-test-pki"]
    healthcheck:
      disable: true
    volumes:
      - test-pki:/pki
    network_mode: none
    restart: "no"

  relay:
    environment: *relay-test-env
    ports: !reset []
    volumes:
      - test-pki:/etc/test-pki:ro
    networks: !override
      private:
        ipv4_address: 10.0.1.5
      internet:
        ipv4_address: 10.0.2.5
    depends_on: *depends-provider
    healthcheck:
      interval: 5s
      start_period: 10s

  # Même image, identifiants SASL ERRONÉS : les mails doivent rester en file.
  relay-badcreds:
    extends:
      file: docker-compose.yml
      service: relay
    hostname: relay-badcreds
    environment:
      <<: *relay-test-env
      RELAY_SMTP_PASSWORD_FILE: /run/secrets/relay_smtp_password_bad
    secrets:
      - relay_smtp_password_bad
    ports: !reset []
    volumes: !override
      - relay-badcreds-queue:/var/spool/postfix
      - test-pki:/etc/test-pki:ro
    networks: !override
      private:
        ipv4_address: 10.0.1.6
      internet:
        ipv4_address: 10.0.2.6
    depends_on: *depends-provider
    healthcheck:
      interval: 5s
      start_period: 10s

  # Fournisseur simulé : smarthost Postfix 587 (TLS + SASL) -> LMTP -> Dovecot (IMAPS).
  provider:
    build: ./test/provider
    image: smtp-relay-test/provider:latest
    hostname: provider
    secrets:
      - relay_smtp_username
      - relay_smtp_password
      - mailbox_password
    volumes:
      - test-pki:/pki:ro
      - provider-mail:/var/vmail
    networks:
      internet:
        ipv4_address: 10.0.2.10
    depends_on:
      pki:
        condition: service_completed_successfully

  # Poste destinataire simulé (rôle de Thunderbird) : IMAPS, RNP, GnuPG.
  workstation:
    build: ./test/workstation
    image: smtp-relay-test/workstation:latest
    hostname: workstation
    init: true
    secrets:
      - mailbox_password
    volumes:
      - test-pki:/pki:ro
    networks:
      internet:
        ipv4_address: 10.0.2.50
    depends_on:
      pki:
        condition: service_completed_successfully

  client-gitlab:
    build: ./test/client
    image: smtp-relay-test/client:latest
    hostname: gitlab
    init: true
    volumes:
      - test-pki:/pki:ro
    networks:
      private:
        ipv4_address: 10.0.1.10
    depends_on:
      pki:
        condition: service_completed_successfully

  client-jenkins:
    build: ./test/client
    image: smtp-relay-test/client:latest
    hostname: jenkins
    init: true
    volumes:
      - test-pki:/pki:ro
    networks:
      private:
        ipv4_address: 10.0.1.20
    depends_on:
      pki:
        condition: service_completed_successfully

  client-unknown:
    build: ./test/client
    image: smtp-relay-test/client:latest
    hostname: unknown-app
    init: true
    volumes:
      - test-pki:/pki:ro
    networks:
      private:
        ipv4_address: 10.0.1.30
    depends_on:
      pki:
        condition: service_completed_successfully

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
  internet:
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24

volumes:
  test-pki:
  provider-mail:
  relay-badcreds-queue:

secrets:
  relay_smtp_username:
    file: ./tests/.work/secrets/relay_smtp_username
  relay_smtp_password:
    file: ./tests/.work/secrets/relay_smtp_password
  relay_smtp_password_bad:
    file: ./tests/.work/secrets/relay_smtp_password_bad
  mailbox_password:
    file: ./tests/.work/secrets/mailbox_password
