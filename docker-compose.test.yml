# =============================================================================
#  Stack de TEST — surcharge de docker-compose.yml (le relai testé est donc
#  exactement celui de production, seuls les paramètres changent).
#  Lancée par tests/run-tests.sh :
#    docker compose -p smtp-relay-test --env-file tests/test.env \
#      -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
#  Réseaux (IP fixes, sans accès extérieur) :
#    private  10.0.1.0/24 : clients gitlab .10, jenkins .20, unknown .30 (NON
#                           déclaré), glpi .40, youtrack .45, new .50 (déclaré
#                           en cours de test, IT1.10) ; relay .5 (alias
#                           smtp-relay), relay-badcreds .6
#    internet 10.0.2.0/24 : relay .5, relay-badcreds .6, provider .10,
#                           keydir .30 (alias openpgpkey.example.com),
#                           workstation .50
#    backend  10.0.3.0/24 : relay .5, relay-badcreds .6, gateway .20, keydir .30
#  Inventaire : tests/.work/config/applications.toml (copie de
#  tests/fixtures/applications.toml) ; secrets : tests/.work/secrets.
# =============================================================================

x-relay-test-env: &relay-test-env
  RELAY_HOST: provider
  RELAY_PORT: "587"
  RELAY_TLS_SECURITY_LEVEL: secure
  RELAY_TLS_CA_FILE: /etc/test-pki/ca.crt
  RELAY_TLS_CERT_FILE: /etc/test-pki/smtp-relay.crt
  RELAY_TLS_KEY_FILE: /etc/test-pki/smtp-relay.key
  RELAY_AUTH_RATE_LIMIT: "1000"

x-depends-relay: &depends-relay
  provider:
    condition: service_healthy
  gateway:
    condition: service_healthy

x-client: &client
  build: ./test/client
  image: smtp-relay-test/client:latest
  init: true
  volumes:
    - test-pki:/pki:ro
  depends_on:
    pki:
      condition: service_completed_successfully

services:
  # One-shot : PKI de test (AC + certificats provider, smtp-relay, keydir).
  pki:
    build: ./test/provider
    image: smtp-relay-test/provider:latest
    entrypoint: ["/usr/local/bin/gen-test-pki"]
    healthcheck:
      disable: true
    volumes:
      - test-pki:/pki
    network_mode: none
    restart: "no"

  relay:
    environment: *relay-test-env
    secrets: !override
      - relay_smtp_username
      - relay_smtp_password
    ports: !reset []
    volumes: !override
      - relay-queue:/var/spool/postfix
      - test-pki:/etc/test-pki:ro
      - ./tests/.work/config:/etc/relay:ro
      - ./tests/.work/secrets/apps:/run/secrets/apps:ro
    networks: !override
      private:
        ipv4_address: 10.0.1.5
        aliases: [smtp-relay]
      internet:
        ipv4_address: 10.0.2.5
      backend:
        ipv4_address: 10.0.3.5
    depends_on: *depends-relay
    healthcheck:
      interval: 5s
      start_period: 10s

  # Même image, identifiants SASL ERRONÉS chez le fournisseur : les mails
  # doivent rester en file.
  relay-badcreds:
    extends:
      file: docker-compose.yml
      service: relay
    hostname: relay-badcreds
    environment:
      <<: *relay-test-env
      RELAY_SMTP_PASSWORD_FILE: /run/secrets/relay_smtp_password_bad
    secrets: !override
      - relay_smtp_username
      - relay_smtp_password
      - relay_smtp_password_bad
    ports: !reset []
    volumes: !override
      - relay-badcreds-queue:/var/spool/postfix
      - test-pki:/etc/test-pki:ro
      - ./tests/.work/config:/etc/relay:ro
      - ./tests/.work/secrets/apps:/run/secrets/apps:ro
    networks: !override
      private:
        ipv4_address: 10.0.1.6
      internet:
        ipv4_address: 10.0.2.6
      backend:
        ipv4_address: 10.0.3.6
    depends_on: *depends-relay
    healthcheck:
      interval: 5s
      start_period: 10s

  gateway:
    volumes: !override
      - ./tests/.work/config:/etc/relay:ro
    networks: !override
      backend:
        ipv4_address: 10.0.3.20
    healthcheck:
      interval: 5s
      start_period: 5s

  keydir:
    environment:
      KEYDIR_DOMAINS: "example.com partner.test"
      KEYDIR_TLS_CERT_FILE: /etc/test-pki/keydir.crt
      KEYDIR_TLS_KEY_FILE: /etc/test-pki/keydir.key
    secrets: !reset []
    ports: !reset []
    volumes: !override
      - keydir-data:/var/lib/keydir
      - test-pki:/etc/test-pki:ro
    networks: !override
      internet:
        ipv4_address: 10.0.2.30
        aliases: [keydir, openpgpkey.example.com]
      backend:
        ipv4_address: 10.0.3.30
    depends_on:
      pki:
        condition: service_completed_successfully
    healthcheck:
      interval: 5s
      start_period: 5s

  # Fournisseur simulé : smarthost Postfix 587 (TLS + SASL) -> LMTP -> Dovecot (IMAPS).
  provider:
    build: ./test/provider
    image: smtp-relay-test/provider:latest
    hostname: provider
    secrets:
      - relay_smtp_username
      - relay_smtp_password
      - mailbox_password
    volumes:
      - test-pki:/pki:ro
      - provider-mail:/var/vmail
    networks:
      internet:
        ipv4_address: 10.0.2.10
    depends_on:
      pki:
        condition: service_completed_successfully

  # Poste destinataire simulé (rôle de Thunderbird) : IMAPS, RNP, GnuPG.
  workstation:
    build: ./test/workstation
    image: smtp-relay-test/workstation:latest
    hostname: workstation
    init: true
    secrets:
      - mailbox_password
    volumes:
      - test-pki:/pki:ro
    networks:
      internet:
        ipv4_address: 10.0.2.50
    depends_on:
      pki:
        condition: service_completed_successfully

  client-gitlab:
    <<: *client
    hostname: gitlab
    networks:
      private:
        ipv4_address: 10.0.1.10

  client-jenkins:
    <<: *client
    hostname: jenkins
    networks:
      private:
        ipv4_address: 10.0.1.20

  client-unknown:
    <<: *client
    hostname: unknown-app
    networks:
      private:
        ipv4_address: 10.0.1.30

  client-glpi:
    <<: *client
    hostname: glpi
    networks:
      private:
        ipv4_address: 10.0.1.40

  client-youtrack:
    <<: *client
    hostname: youtrack
    networks:
      private:
        ipv4_address: 10.0.1.45

  client-new:
    <<: *client
    hostname: newapp
    networks:
      private:
        ipv4_address: 10.0.1.50

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
  internet:
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 10.0.3.0/24

volumes:
  test-pki:
  provider-mail:
  relay-badcreds-queue:

secrets:
  relay_smtp_username:
    file: ./tests/.work/secrets/relay_smtp_username
  relay_smtp_password:
    file: ./tests/.work/secrets/relay_smtp_password
  relay_smtp_password_bad:
    file: ./tests/.work/secrets/relay_smtp_password_bad
  mailbox_password:
    file: ./tests/.work/secrets/mailbox_password
